[package]
name = "cegueira"
version = "0.1.0"
description = "Cegueira 桌面客户端（Rust 薄壳）"
edition = "2021"
rust-version = "1.77"

# 库目标：Tauri 要求 staticlib + cdylib + rlib
[lib]
name = "cegueira_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
keyring = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
